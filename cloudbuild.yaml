steps:
  # Step 1: Build and push backend image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/learnpath/learnpath-backend', './backend']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/learnpath/learnpath-backend']

  # Step 2: Deploy backend to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'learnpath-backend'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/learnpath/learnpath-backend'
      - '--platform'
      - 'managed'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'GEMINI_API_KEY=${_GEMINI_API_KEY},YOUTUBE_API_KEY=${_YOUTUBE_API_KEY},ELEVENLABS_API_KEY=${_ELEVENLABS_API_KEY},MONGODB_URI=${_MONGODB_URI}'

  # Step 3: Get backend URL and build frontend with it
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        BACKEND_URL=$(gcloud run services describe learnpath-backend --region=us-central1 --format='value(status.url)')
        echo "Backend URL: $$BACKEND_URL"
        echo "VITE_API_URL=$$BACKEND_URL" > ./frontend/.env.production

  # Step 4: Build and push frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/learnpath/learnpath-frontend', './frontend']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/learnpath/learnpath-frontend']

  # Step 5: Deploy frontend to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'learnpath-frontend'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/learnpath/learnpath-frontend'
      - '--platform'
      - 'managed'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/learnpath/learnpath-frontend'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/learnpath/learnpath-backend'
